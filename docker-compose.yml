services:
  webvirtcloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: webvirtcloud:latest
    container_name: webvirtcloud
    restart: unless-stopped
    ports:
      - "8000:80"      # Web 面板（宿主 8000）
      - "6080:6080"    # noVNC/SPICE 控制台
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - webvirtcloud-data:/srv/webvirtcloud/data
      - webvirtcloud-ssh:/var/www/.ssh
      # 直连宿主 libvirt（socket 权限 666，容器可直接用）
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  webvirtcloud-data:
    driver: local
  webvirtcloud-ssh:
    driver: local
