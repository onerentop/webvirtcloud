services:
  webvirtcloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: webvirtcloud:latest
    container_name: webvirtcloud
    restart: unless-stopped
    ports:
      - "8000:80"      # Web 面板（宿主 8000）
      - "6080:6080"    # noVNC/SPICE 控制台
    environment:
      - TZ=Asia/Shanghai
      # 面板对外域名（HTTPS 经 HK 的 Caddy 反代进来），供 Django 的 CSRF 校验信任
      - CSRF_TRUSTED_ORIGINS=https://panel.vm.topren.top:9443,https://panel.vm.topren.top
      # noVNC 与控制台同源：浏览器连 wss://<面板域名>:9443/novncd/，由 Caddy 转发到容器 6080
      - WS_PUBLIC_PORT=443
    volumes:
      - webvirtcloud-data:/srv/webvirtcloud/data
      - webvirtcloud-ssh:/var/www/.ssh
      # 直连宿主 libvirt（socket 权限 666，容器可直接用）
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  webvirtcloud-data:
    driver: local
  webvirtcloud-ssh:
    driver: local
